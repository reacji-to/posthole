<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>posthole</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/32.png" alt=""><h1>posthole</h1></div>
    <label class="switch"><input type="checkbox" id="recording"> <span id="recording-label">Saving</span></label>
  </header>
  <p id="where" class="where muted"></p>
  <ul id="counts" class="counts"></ul>
  <p id="assets" class="muted"></p>
  <div id="last" class="last" hidden></div>
  <p id="problem" class="error" hidden></p>
  <section class="auto-scroll" aria-labelledby="auto-scroll-heading">
    <h2 id="auto-scroll-heading">Auto-scroll</h2>
    <p class="muted">Scroll this feed while you use other tabs.</p>
    <form id="auto-scroll-form">
      <label for="scroll-minutes">Run for</label>
      <input id="scroll-minutes" type="number" min="1" max="120" step="1" value="5" required>
      <span>minutes</span>
      <button id="scroll-start" type="submit">Start</button>
      <button id="scroll-stop" type="button" hidden>Stop</button>
    </form>
    <label class="thread-switch"><input type="checkbox" id="save-threads"> Save reply threads</label>
    <p id="thread-limits" class="muted"></p>
    <p id="scroll-status" class="muted" role="status"></p>
    <p id="scroll-error" class="error" role="alert" hidden></p>
  </section>
  <footer>
    <button id="open" class="primary">Open folder</button>
    <button id="settings">Settings</button>
    <button id="check-updates">Check for updates</button>
  </footer>
  <p id="update-status" class="muted" role="status"></p>
  <script src="popup.js"></script>
</body>
</html>
